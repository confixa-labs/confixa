x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  publishedVersion: "1.2.2"
  publishedVersionMetadata:
    releaseNote: Initial release of Confixa platform.
    releaseTypes:
      - Feature
    recommended: false
  deployerServiceAccount:
    description: "Service account for Confixa deployer with comprehensive Kubernetes permissions"
    roles:
      - type: ClusterRole
        rulesType: CUSTOM
        rules:
          # Core API group resources
          - apiGroups: [""]
            resources:
              - secrets
              - configmaps
              - services
              - serviceaccounts
              - persistentvolumes
              - persistentvolumeclaims
              - pods
              - pods/log
              - namespaces
              - events
              - endpoints
            verbs:
              ["get", "list", "watch", "create", "update", "patch", "delete"]

          # Apps API group
          - apiGroups: ["apps"]
            resources:
              - deployments
              - statefulsets
              - replicasets
              - daemonsets
            verbs:
              ["get", "list", "watch", "create", "update", "patch", "delete"]

          # Scale subresources (required for scaling operations)
          - apiGroups: ["apps"]
            resources:
              - deployments/scale
              - statefulsets/scale
              - replicasets/scale
            verbs: ["get", "update", "patch"]

          # Batch API group
          - apiGroups: ["batch"]
            resources:
              - jobs
              - cronjobs
            verbs:
              ["get", "list", "watch", "create", "update", "patch", "delete"]

          # RBAC resources (with bind and escalate for creating roles)
          - apiGroups: ["rbac.authorization.k8s.io"]
            resources:
              - roles
              - rolebindings
              - clusterroles
              - clusterrolebindings
            verbs:
              [
                "get",
                "list",
                "watch",
                "create",
                "update",
                "patch",
                "delete",
                "bind",
                "escalate",
              ]

          # Networking API group
          - apiGroups: ["networking.k8s.io"]
            resources:
              - networkpolicies
              - ingresses
              - ingressclasses
            verbs:
              ["get", "list", "watch", "create", "update", "patch", "delete"]

          # Policy API group
          - apiGroups: ["policy"]
            resources:
              - poddisruptionbudgets
            verbs:
              ["get", "list", "watch", "create", "update", "patch", "delete"]

          # Application CRD (required for marketplace)
          - apiGroups: ["app.k8s.io"]
            resources:
              - applications
            verbs:
              ["get", "list", "watch", "create", "update", "patch", "delete"]

          # Custom Resource Definitions
          - apiGroups: ["apiextensions.k8s.io"]
            resources:
              - customresourcedefinitions
            verbs: ["get", "list", "watch", "create", "update", "patch"]

          # Storage API group
          - apiGroups: ["storage.k8s.io"]
            resources:
              - storageclasses
              - volumeattachments
            verbs: ["get", "list", "watch"]

          # Autoscaling API group
          - apiGroups: ["autoscaling"]
            resources:
              - horizontalpodautoscalers
            verbs:
              ["get", "list", "watch", "create", "update", "patch", "delete"]

          # Coordination API group (for leader election)
          - apiGroups: ["coordination.k8s.io"]
            resources:
              - leases
            verbs:
              ["get", "list", "watch", "create", "update", "patch", "delete"]

          # Metrics API group (for HPA)
          - apiGroups: ["metrics.k8s.io"]
            resources:
              - pods
              - nodes
            verbs: ["get", "list"]
  images:
    usagereporter:
      properties:
        usageReporter.image.repository:
          type: REPO_WITH_REGISTRY
        usageReporter.image.tag:
          type: TAG
    apigateway:
      properties:
        apiGateway.image.repository:
          type: REPO_WITH_REGISTRY
        apiGateway.image.tag:
          type: TAG
    llmkumaapigateway:
      properties:
        llmKumaApiGateway.image.repository:
          type: REPO_WITH_REGISTRY
        llmKumaApiGateway.image.tag:
          type: TAG
    frontend:
      properties:
        frontend.image.repository:
          type: REPO_WITH_REGISTRY
        frontend.image.tag:
          type: TAG
    redis:
      properties:
        redis.image.repository:
          type: REPO_WITH_REGISTRY
        redis.image.tag:
          type: TAG
    rabbitmq:
      properties:
        rabbitmq.image.repository:
          type: REPO_WITH_REGISTRY
        rabbitmq.image.tag:
          type: TAG

properties:
  # BASIC DEPLOYMENT CONFIGURATION
  name:
    type: string
    x-google-marketplace:
      type: NAME
    title: "Application Name"
    description: "Name for the Confixa application deployment"
    default: "confixa"

  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE
    title: "Namespace"
    description: "Kubernetes namespace for Confixa deployment"
    default: "confixa"

  # MARKETPLACE REPORTING SECRET (Auto-injected by Marketplace)
  reportingSecret:
    type: string
    x-google-marketplace:
      type: REPORTING_SECRET

  # STORAGE CONFIGURATION
  persistence.storageClass:
    type: string
    title: "Storage Class"
    description: "StorageClass for persistent volumes (leave empty for default)"
    x-google-marketplace:
      type: STORAGE_CLASS
      storageClass:
        type: SSD

  persistence.size:
    type: string
    title: "Storage Size"
    description: "Storage size for persistent volumes"
    default: "20Gi"
    pattern: '^[1-9][0-9]*(\.[0-9]+)?[TGM]i?$'

  # SCALABILITY CONFIGURATION (Optional - Advanced Users)
  apiGateway.replicas:
    type: integer
    title: "API Gateway Replicas"
    description: "Number of API Gateway replicas for high availability"
    default: 1
    minimum: 1
    maximum: 5

  frontend.replicas:
    type: integer
    title: "Frontend Replicas"
    description: "Number of Frontend replicas for high availability"
    default: 1
    minimum: 1
    maximum: 5

  llmKumaApiGateway.replicas:
    type: integer
    title: "LLM Gateway Replicas"
    description: "Number of LLM Gateway replicas for high availability"
    default: 1
    minimum: 1
    maximum: 3

  # AUTO-GENERATED PASSWORDS (Marketplace managed)
  mongodb.rootPassword:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 16
        base64: true

  mongodb.userPassword:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 16
        base64: true

  redis.password:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 16
        base64: true

  rabbitmq.password:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 16
        base64: true

  argocd.adminPassword:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 16
        base64: true

required:
  - name
  - namespace
  - persistence.size
  - redis.password
  - mongodb.rootPassword
  - mongodb.userPassword
  - rabbitmq.password
  - argocd.adminPassword
  - reportingSecret
