# Service URLs
service:
  url:
    frontend: "http://localhost:5000"
    backend: "http://localhost:5001"
    argocd: "http://localhost:3000"
    kubeCost: "http://localhost:9090"
    clusterDashboard: "http://localhost:9091"

# Status Check
statusCheck:
  enabled: false

# Marketplace Configuration (Non-sensitive)
marketplace:
  projectId: "confixa-public"
  serviceName: "confixa-new.endpoints.confixa-public.cloud.goog"
  metricName: "confixa_plan" # updated with correct metric name
  planId: "basic"
  environment: "prod"
  region: "us"

# Usage Reporter Configuration
usageReporter:
  enable: true
  name: confixa-usage-reporter
  containerName: confixa-usage-reporter
  image:
    repository: us-docker.pkg.dev/confixa-public/confixa-helm-repo-oci/usagereporter
    tag: 1.2.2
    pullPolicy: Always
  annotations:
    git: https://github.com/confixa-labs/confixa.git
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  restartPolicy: OnFailure
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 600m
      memory: 1024Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  mongodb:
    uri: "mongodb+srv://confixa:dFfq9ltvKjI84k3W@confixa-prod.v0bhh.mongodb.net/confixa"
    database: "confixa-marketplace-usage"

# Persistence Configuration
persistence:
  storageClass: "" # Will be overridden by schema.yaml value
  size: "20Gi" # Will be overridden by schema.yaml value
