# Redis Configuration
redis:
  enable: true
  name: "confixa-redis"
  containerName: "confixa-redis"
  image:
    repository: us-docker.pkg.dev/confixa-public/confixa-helm-repo-oci/redis
    tag: "1.2.2"
    pullPolicy: IfNotPresent
  service:
    name: "confixa-redis-master"
    type: ClusterIP
    port: 6379
  auth:
    enabled: true
    existingSecret: "redis-password-secret"
    secretPasswordKey: "redis-password"
  master:
    persistence:
      enabled: true
      storageClass: "" # Will be set from persistence.storageClass
      size: 4Gi
  replica:
    replicaCount: 0 # Set to 0 for single instance, increase for HA
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
      ephemeral-storage: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 50Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# RabbitMQ Configuration
rabbitmq:
  enable: true
  name: "confixa-rabbitmq"
  containerName: "confixa-rabbitmq"
  image:
    repository: us-docker.pkg.dev/confixa-public/confixa-helm-repo-oci/rabbitmq
    tag: "1.2.2"
    pullPolicy: Always
  service:
    name: "confixa-rabbitmq"
    type: ClusterIP
    port: 5672
  auth:
    username: admin
    existingPasswordSecret: "rabbitmq-password-secret"
    secretPasswordKey: "rabbitmq-password"
    # Don't set password here - it conflicts with existingPasswordSecret
  persistence:
    enabled: true
    storageClass: "" # Will be set from persistence.storageClass
    size: 4Gi
  resources:
    limits:
      cpu: 300m
      memory: 320Mi
      ephemeral-storage: 1Gi
    requests:
      cpu: 150m
      memory: 200Mi
      ephemeral-storage: 50Mi
  clustering:
    enabled: false
  extraConfiguration: |
    cluster_name = test-confixa-rabbitmq
    loopback_users.admin = false
    prometheus.tcp.port = 9419
  nodeSelector: {}
  tolerations: []
  affinity: {}

# MongoDB Configuration
mongodb:
  enable: true
  name: "confixa-mongodb"
  containerName: "confixa-mongodb"
  image:
    repository: mongo
    tag: "7.0.14" # Stable version for marketplace
    pullPolicy: IfNotPresent
  service:
    name: "confixa-mongodb"
    type: ClusterIP
    port: 27017
  auth:
    rootUser: root
    rootPassword: "" # Marketplace will inject mongodb.rootPassword
    rootDatabase: "confixa"
    usernames: ["confixa-admin"]
    userPassword: "" # Marketplace will inject mongodb.userPassword
    databases: ["confixa"]
  persistence:
    enabled: true
    storageClass: "" # Will be set from persistence.storageClass
    size: 8Gi
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Application Configuration
appName: confixa
commonConfigMap: confixa-configmap
passwordSecretsManagerName: confixa-passwords-secret
passwordRedisSecretsManagerName: redis-password-secret
passwordRabbitMQSecretsManagerName: rabbitmq-password-secret

# API Gateway Configuration
apiGateway:
  enable: true
  issueCron:
    enable: true
    name: confixa-issue-cron
    containerName: confixa-issue-cron
  monitorCleaner:
    enable: true
    name: confixa-monitor-cleaner
    containerName: confixa-monitor-cleaner
  bitbucketOauthToken:
    enable: true
    name: confixa-bitbucket-oauth-token
    containerName: confixa-bitbucket-oauth-token
  oddSlug:
    enable: true
    name: confixa-odd-slug
    containerName: confixa-odd-slug
  evenSlug:
    enable: true
    name: confixa-even-slug
    containerName: confixa-even-slug
  argoCdCheckStatus:
    enable: true
    name: confixa-argocd-check-status
    containerName: confixa-argocd-check-status
  name: confixa-api
  containerName: confixa-api
  image:
    repository: us-docker.pkg.dev/confixa-public/confixa-helm-repo-oci/apigateway
    tag: 1.2.2
    pullPolicy: Always
  annotations:
    git: https://github.com/confixa-labs/confixa.git
  replicas: 1
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 600m
      memory: 1024Mi
  ports:
    containerPort: 5001
    protocol: TCP
  configMapRef: confixa-api
  service:
    protocol: TCP
    port: 80
    targetPort: 5001
    type: ClusterIP

# LLM Gateway Configuration
llmKumaApiGateway:
  enable: true
  name: confixa-llm-kuma-api
  containerName: confixa-llm-kuma-api
  image:
    repository: us-docker.pkg.dev/confixa-public/confixa-helm-repo-oci/llmkumaapigateway
    tag: 1.2.2
    pullPolicy: Always
  annotations:
    git: https://github.com/confixa-labs/confixa.git
  replicas: 1
  ports:
    containerPort: 5002
    protocol: TCP
  configMapRef: confixa-llm-kuma-api
  service:
    name: confixa-llm-kuma-api
    protocol: TCP
    port: 80
    targetPort: 5002
    type: ClusterIP

# Frontend Configuration
frontend:
  enable: true
  name: confixa-frontend
  containerName: confixa-frontend
  image:
    repository: us-docker.pkg.dev/confixa-public/confixa-helm-repo-oci/frontend
    tag: 1.2.2
    pullPolicy: Always
  annotations:
    git: https://github.com/confixa-labs/confixa.git
  replicas: 1
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 600m
      memory: 1024Mi
  ports:
    containerPort: 5000
    protocol: TCP
  configMapRef: confixa-frontend
  service:
    protocol: TCP
    port: 80
    targetPort: 5000
    type: ClusterIP

