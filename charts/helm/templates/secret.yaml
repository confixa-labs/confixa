{{- $existingMainSecret := lookup "v1" "Secret" .Release.Namespace .Values.passwordSecretsManagerName }}
{{- $mongoPassword := "" }}
{{- $mongoRootPassword := "" }}
{{- $rmPassword := "" }}
{{- if $existingMainSecret }}
  {{- $mongoPassword = index $existingMainSecret.data "mongodbPassword" | toString }}
  {{- $mongoRootPassword = index $existingMainSecret.data "mongodbRootPassword" | toString }}
  {{- $rmPassword = index $existingMainSecret.data "rabbitmqPassword" | toString }}
{{- else }}
  {{- $mongoPassword = randAlphaNum 16 | b64enc }}
  {{- $mongoRootPassword = randAlphaNum 16 | b64enc }}
  {{- $rmPassword = .Values.rabbitmq.password | b64enc }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.passwordSecretsManagerName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  redisHost: {{ printf "confixa-redis-master.%s.svc.cluster.local" .Release.Namespace | b64enc }}
  rabbitMQHost: {{ printf "confixa-rabbitmq.%s.svc.cluster.local" .Release.Namespace | b64enc }}
  
  rabbitmqPassword: {{ $rmPassword }}
  rabbitMQUrl: {{ printf "amqp://%s:%s@%s.%s.svc.cluster.local:5672" .Values.rabbitmq.auth.username ($rmPassword | b64dec) .Values.rabbitmq.service.name .Release.Namespace | b64enc }}

  mongodbPassword: {{ $mongoPassword }}
  mongodbRootPassword: {{ $mongoRootPassword }}

  mongodbRootHost: {{ printf "mongodb://%s:%s@%s.%s.svc.cluster.local:27017/%s?authSource=admin" .Values.mongodb.auth.rootUser ($mongoRootPassword | b64dec) .Values.mongodb.service.name .Release.Namespace .Values.mongodb.auth.rootDatabase | b64enc }}

  llmKumaHost: {{ printf "http://%s.%s.svc.cluster.local" .Values.llmKumaApiGateway.service.name .Release.Namespace | b64enc }}