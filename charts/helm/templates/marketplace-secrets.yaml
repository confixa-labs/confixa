# apiVersion: v1
# kind: Secret
# metadata:
#   name: marketplace-secret
#   namespace: { { .Release.Namespace } }
# type: Opaque
# data:
#   # Base64 encoded entitlement ID from Google Marketplace
#   entitlement-id: "{{ .Values.marketplace.entitlementId | b64enc }}"

#   # Base64 encoded consumer ID (usage reporting ID) from Google
#   consumer-id: "{{ .Values.marketplace.consumerId | b64enc }}"

#   # Base64 encoded marketplace project ID
#   marketplace-project-id: "{{ .Values.marketplace.projectId | b64enc }}"

#   # Base64 encoded marketplace service name
#   marketplace-service-name: "{{ .Values.marketplace.serviceName | b64enc }}"

#   # Base64 encoded metric name
#   metric-name: "{{ .Values.marketplace.metricName | b64enc }}"

#   # Base64 encoded plan ID
#   plan-id: "{{ .Values.marketplace.planId | b64enc }}"

#   # Base64 encoded environment
#   environment: "{{ .Values.marketplace.environment | b64enc }}"

#   # Base64 encoded region
#   region: "{{ .Values.marketplace.region | b64enc }}"

# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: google-service-account-secret
#   namespace: { { .Release.Namespace } }
# type: Opaque
# data:
#   # Base64 encoded Google service account JSON key
#   # This should be the entire contents of your service-account-key.json file, base64 encoded
#   key.json: "{{ .Values.marketplace.serviceAccountKey | b64enc }}"
