{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "rabbitmq-password-secret" }}
{{- $rmPassword := "" }}
{{- if $existingSecret }}
  {{- $rmPassword = index $existingSecret.data "rabbitmq-password" | toString }}
{{- else }}
  {{- $rmPassword = randAlphaNum 16 | b64enc }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-password-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  rabbitmq-password: {{ $rmPassword }}

---
# Fixed Redis password with proper lookup syntax  
{{- $existingRedisSecret := lookup "v1" "Secret" .Release.Namespace "redis-password-secret" }}
{{- $redisPassword := "" }}
{{- if $existingRedisSecret }}
  {{- $redisPassword = index $existingRedisSecret.data "redis-password" | toString }}
{{- else }}
  {{- $redisPassword = randAlphaNum 16 | b64enc }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: redis-password-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  redis-password: {{ $redisPassword }}

---
apiVersion: v1
kind: Secret
metadata:
  name: artifact
  namespace: {{ .Release.Namespace }}
type: Opaque

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.usageReporter.name }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.usageReporter.name }}
    app.kubernetes.io/component: usage-reporter
type: Opaque
data: 
  mongo-uri: {{ .Values.usageReporter.mongodb.uri | b64enc }}