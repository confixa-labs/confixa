{{- if .Values.usageReporter.enable }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Values.usageReporter.name }}-cleanup"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.usageReporter.name }}-cleanup
    app.kubernetes.io/component: cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.usageReporter.name }}-cleanup
    spec:
      serviceAccountName: {{ .Values.usageReporter.name }}-cleanup
      restartPolicy: Never
      containers:
      - name: cleanup
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting cleanup of usage reporter resources..."
          
          # Function to safely delete resource
          safe_delete() {
            RESOURCE_TYPE=$1
            RESOURCE_NAME=$2
            
            if kubectl get $RESOURCE_TYPE $RESOURCE_NAME 2>/dev/null; then
              echo "Deleting $RESOURCE_TYPE: $RESOURCE_NAME"
              kubectl delete $RESOURCE_TYPE $RESOURCE_NAME --ignore-not-found=true
              
              # Wait for deletion to complete
              kubectl wait --for=delete $RESOURCE_TYPE/$RESOURCE_NAME --timeout=60s 2>/dev/null || true
              echo "✅ $RESOURCE_TYPE $RESOURCE_NAME deleted"
            else
              echo "ℹ️  $RESOURCE_TYPE $RESOURCE_NAME does not exist, skipping"
            fi
          }
          
          # Clean up ClusterRole and ClusterRoleBinding
          safe_delete "clusterrole" "{{ .Values.usageReporter.name }}"
          safe_delete "clusterrolebinding" "{{ .Values.usageReporter.name }}"
          
          # Clean up any stuck finalizers (if needed)
          echo "Checking for stuck finalizers..."
          kubectl patch clusterrole {{ .Values.usageReporter.name }} -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          kubectl patch clusterrolebinding {{ .Values.usageReporter.name }} -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          
          echo "🎉 Cleanup completed successfully"
          exit 0
        
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

---
# ServiceAccount for cleanup job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.usageReporter.name }}-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed

---
# ClusterRole for cleanup operations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.usageReporter.name }}-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "delete", "patch"]

---
# ClusterRoleBinding for cleanup
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.usageReporter.name }}-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10" 
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.usageReporter.name }}-cleanup
subjects:
- kind: ServiceAccount
  name: {{ .Values.usageReporter.name }}-cleanup
  namespace: {{ .Release.Namespace }}
{{- end }}