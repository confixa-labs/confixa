{{- if .Values.usageReporter.enable }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Values.appName }}-post-cleanup"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.appName }}-post-cleanup
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.appName }}-post-cleanup
    spec:
      serviceAccountName: {{ .Values.appName }}-cleanup
      restartPolicy: Never
      containers:
      - name: cleanup
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - -c
        - |
          echo "Starting post-delete cleanup..."
          
          # Wait for a moment to ensure pods are terminated
          sleep 15
          
          # List remaining PVCs
          echo "Checking remaining PVCs in namespace {{ .Release.Namespace }}:"
          kubectl get pvc -n {{ .Release.Namespace }} || echo "No PVCs found"
          
          # Remove finalizers and delete PVCs
          for pvc in $(kubectl get pvc -n {{ .Release.Namespace }} -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo ""); do
            if [ ! -z "$pvc" ]; then
              echo "Force cleaning PVC: $pvc"
              kubectl patch pvc $pvc -n {{ .Release.Namespace }} -p '{"metadata":{"finalizers":null}}' --type=merge || echo "Failed to patch $pvc"
              kubectl delete pvc $pvc -n {{ .Release.Namespace }} --force --grace-period=0 || echo "Failed to delete $pvc"
            fi
          done
          
          # Clean up orphaned PVs
          echo "Cleaning up released/available PVs..."
          for pv in $(kubectl get pv --no-headers | grep -E "(Released|Available)" | awk '{print $1}' || echo ""); do
            if [ ! -z "$pv" ]; then
              echo "Deleting PV: $pv"
              kubectl delete pv $pv || echo "Failed to delete PV $pv"
            fi
          done
          
          echo "Post-delete cleanup completed"

---
# Same ServiceAccount and RBAC as before
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.appName }}-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.appName }}-cleanup
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "persistentvolumes"]
  verbs: ["get", "list", "delete", "patch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings"]
  verbs: ["delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.appName }}-cleanup
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.appName }}-cleanup
subjects:
- kind: ServiceAccount
  name: {{ .Values.appName }}-cleanup
  namespace: {{ .Release.Namespace }}
{{- end }}