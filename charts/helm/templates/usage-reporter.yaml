---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.usageReporter.name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.usageReporter.name }}
    app.kubernetes.io/component: usage-reporter
data:
  # Marketplace configuration (non-sensitive) - matches Python script expectations
  MARKETPLACE_PROJECT_ID: "{{ .Values.marketplace.projectId }}"
  MARKETPLACE_SERVICE_NAME: "{{ .Values.marketplace.serviceName }}"
  METRIC_NAME: "{{ .Values.marketplace.metricName }}"
  PLAN_ID: "{{ .Values.marketplace.planId }}"
  ENVIRONMENT: "{{ .Values.marketplace.environment }}"
  REGION: "{{ .Values.marketplace.region }}"
  
  # Usage configuration
  USAGE_UNIT: "cluster"
  
  # Logging
  LOG_LEVEL: "INFO"

  # MongoDB details
  MONGO_DATABASE: "{{ .Values.usageReporter.mongodb.database }}"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.usageReporter.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.usageReporter.name }}
    app.kubernetes.io/component: usage-reporter

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-{{ .Values.usageReporter.name }}-role
  labels:
    app.kubernetes.io/name: {{ .Values.usageReporter.name }}
    app.kubernetes.io/component: usage-reporter
rules:
# Read cluster metadata for usage reporting
- apiGroups: [""]
  resources: ["namespaces", "nodes", "pods"]
  verbs: ["get", "list"]
# Read metrics if available
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-{{ .Values.usageReporter.name }}-binding
  labels:
    app.kubernetes.io/name: {{ .Values.usageReporter.name }}
    app.kubernetes.io/component: usage-reporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-{{ .Values.usageReporter.name }}-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.usageReporter.name }}
  namespace: {{ .Release.Namespace }}

---
{{- if .Values.usageReporter.enable }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.usageReporter.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    description: "Hourly monitoring with daily usage reporting for Google Cloud Marketplace"
    {{- with .Values.usageReporter.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Values.usageReporter.name }}
    app.kubernetes.io/component: usage-reporter
spec:
  schedule: "{{ .Values.usageReporter.schedule }}"
  successfulJobsHistoryLimit: {{ .Values.usageReporter.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.usageReporter.failedJobsHistoryLimit }}
  concurrencyPolicy: {{ .Values.usageReporter.concurrencyPolicy }}
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.usageReporter.name }}
        app.kubernetes.io/component: usage-reporter-job
    spec:
      activeDeadlineSeconds: 1800  # 30 minutes max
      backoffLimit: 6
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Values.usageReporter.name }}
            app.kubernetes.io/component: usage-reporter-pod
        spec:
          serviceAccountName: {{ .Values.usageReporter.name }}
          restartPolicy: {{ .Values.usageReporter.restartPolicy }}
          
          # Security context - matches Dockerfile user (UID 1000)
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000  # Matches Dockerfile appuser
            runAsGroup: 1000
            fsGroup: 1000
          
          containers:
          - name: {{ .Values.usageReporter.containerName }}
            image: "{{ .Values.usageReporter.image.repository }}:{{ .Values.usageReporter.image.tag }}"
            imagePullPolicy: {{ .Values.usageReporter.image.pullPolicy }}
            
            # Security context for container
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            
            # Environment variables from ConfigMap (non-sensitive config)
            envFrom:
            - configMapRef:
                name: {{ .Values.usageReporter.name }}-config
            
            # CRITICAL: Extract marketplace credentials from reporting secret
            # Google Marketplace creates this secret with these specific keys
            env:
            - name: CONSUMER_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.reportingSecret }}"
                  key: consumer-id
            - name: ENTITLEMENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.reportingSecret }}"
                  key: entitlement-id
            - name: REPORTING_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.reportingSecret }}"
                  key: reporting-key
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.usageReporter.name }}-secret"
                  key: mongo-uri
            
            # Volume mounts for writable temp directory
            volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            
            # Resource limits - properly structured with nested values
            resources:
              requests:
                memory: "{{ .Values.usageReporter.resources.requests.memory }}"
                cpu: "{{ .Values.usageReporter.resources.requests.cpu }}"
              limits:
                memory: "{{ .Values.usageReporter.resources.limits.memory }}"
                cpu: "{{ .Values.usageReporter.resources.limits.cpu }}"
          
          # Volumes - only need tmp for writable directory
          volumes:
          - name: tmp-volume
            emptyDir: {}
          
          # Node selection and tolerations
          {{- with .Values.usageReporter.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
          {{- with .Values.usageReporter.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
          {{- with .Values.usageReporter.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}