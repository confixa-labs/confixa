---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.usageReporter.name }}-config
  namespace: {{ .Release.Namespace }}
data:
  # Marketplace configuration - matches Python script expectations
  MARKETPLACE_PROJECT_ID: "{{ .Values.marketplace.projectId }}"
  MARKETPLACE_SERVICE_NAME: "{{ .Values.marketplace.serviceName }}"
  METRIC_NAME: "{{ .Values.marketplace.metricName }}"
  PLAN_ID: "{{ .Values.marketplace.planId }}"
  ENVIRONMENT: "{{ .Values.marketplace.environment }}"
  REGION: "{{ .Values.marketplace.region }}"
  
  # Usage configuration
  USAGE_UNIT: "cluster"
  
  # REPORTING SECRET NAME - From marketplace
  REPORTING_SECRET: "{{ .Values.reportingSecret }}"
  
  # Logging
  LOG_LEVEL: "INFO"

---
# NO LONGER CREATE CREDENTIALS SECRET - MARKETPLACE PROVIDES IT
# The secret is automatically created by Google Cloud Marketplace with name from .Values.reportingSecret

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.usageReporter.name }}
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.usageReporter.name }}
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get"]
  resourceNames: ["kube-system"]  # Restricted to kube-system only for cluster ID detection
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
  # Allows checking pods across all namespaces for health monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.usageReporter.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.usageReporter.name }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.usageReporter.name }}
  namespace: {{ .Release.Namespace }}

---
{{- if .Values.usageReporter.enable }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.usageReporter.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    description: "Hourly monitoring with daily usage reporting for Google Cloud Marketplace"
    {{- with .Values.usageReporter.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  schedule: "{{ .Values.usageReporter.schedule }}"
  successfulJobsHistoryLimit: {{ .Values.usageReporter.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.usageReporter.failedJobsHistoryLimit }}
  concurrencyPolicy: {{ .Values.usageReporter.concurrencyPolicy }}
  
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.usageReporter.name }}
        app.kubernetes.io/component: usage-reporter-job
    spec:
      activeDeadlineSeconds: 1800  # 30 minutes max
      backoffLimit: 6
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Values.usageReporter.name }}
            app.kubernetes.io/component: usage-reporter-pod
        spec:
          serviceAccountName: {{ .Values.usageReporter.name }}
          restartPolicy: {{ .Values.usageReporter.restartPolicy }}
          
          # Security context - matches Dockerfile user (UID 1000)
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000  # Matches Dockerfile appuser
            runAsGroup: 1000
            fsGroup: 1000
          
          containers:
          - name: {{ .Values.usageReporter.containerName }}
            image: "{{ .Values.usageReporter.image.repository }}:{{ .Values.usageReporter.image.tag }}"
            imagePullPolicy: {{ .Values.usageReporter.image.pullPolicy }}
            
            # Security context for container
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            
            # Environment variables from ConfigMap
            envFrom:
            - configMapRef:
                name: {{ .Values.usageReporter.name }}-config
            
            # MARKETPLACE CREDENTIALS - From reporting secret
            env:
            - name: REPORTING_SECRET_NAME
              value: "{{ .Values.reportingSecret }}"
            
            # Volume mounts - MARKETPLACE SECRET MOUNT
            volumeMounts:
            - name: marketplace-reporting-secret
              mountPath: /var/secrets/marketplace
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
            
            # Resource limits - FIXED: Now properly structured with nested values
            resources:
              requests:
                memory: "{{ .Values.usageReporter.resources.requests.memory }}"
                cpu: "{{ .Values.usageReporter.resources.requests.cpu }}"
              limits:
                memory: "{{ .Values.usageReporter.resources.limits.memory }}"
                cpu: "{{ .Values.usageReporter.resources.limits.cpu }}"
          
          # Volumes - MARKETPLACE SECRET
          volumes:
          - name: marketplace-reporting-secret
            secret:
              secretName: "{{ .Values.reportingSecret }}"
          - name: tmp-volume
            emptyDir: {}
          
          # Node selection and tolerations
          {{- with .Values.usageReporter.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
          {{- with .Values.usageReporter.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
          {{- with .Values.usageReporter.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}