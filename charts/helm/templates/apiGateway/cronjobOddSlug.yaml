{{- if (and (.Values.apiGateway.enable) (.Values.apiGateway.oddSlug.enable)) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.apiGateway.oddSlug.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.apiGateway.oddSlug.name }}
spec:
  schedule: "45,15 * * * *"
  concurrencyPolicy: Forbid  # Prevent overlapping jobs
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.apiGateway.oddSlug.name }}
    spec:
      backoffLimit: 6  # Limit retry attempts
      activeDeadlineSeconds: 1800  # 30 minutes max
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Values.apiGateway.oddSlug.name }}
        spec:
          containers:
            - name: {{ .Values.apiGateway.oddSlug.containerName }}
              image: "{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag }}"
              command: ["npm", "run", "cron"]
              envFrom:
                - configMapRef:
                    name: {{ .Values.commonConfigMap }}
              env:
                - name: oddSlugCron
                  value: "true"
                - name: REDIS_AUTH_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.passwordRedisSecretsManagerName }}
                      key: redis-password
                - name: REDIS_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.passwordSecretsManagerName }}
                      key: redisHost
                - name: RABBITMQ_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.passwordRabbitMQSecretsManagerName }}
                      key: rabbitmq-password
                - name: RABBITMQ_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.passwordSecretsManagerName }}
                      key: rabbitMQHost
                - name: MONGO_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.passwordSecretsManagerName }}
                      key: mongodbRootHost
                - name: CONFIXA_LLM_KUMA_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.passwordSecretsManagerName }}
                      key: llmKumaHost
              imagePullPolicy: Always
              resources:
                requests:
                  memory: {{ .Values.apiGateway.resources.requests.memory }}
                  cpu: {{ .Values.apiGateway.resources.requests.cpu }}
                limits:
                  memory: {{ .Values.apiGateway.resources.limits.memory }}
                  cpu: {{ .Values.apiGateway.resources.limits.cpu }}
          restartPolicy: OnFailure
{{- end }}